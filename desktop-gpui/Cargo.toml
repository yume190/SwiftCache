[package]
name = "swiftcache-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native GPUI desktop manager for SwiftCache"
license = "Apache-2.0"

[dependencies]
gpui-kit = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.17"
chrono = "0.4"
url = "2"
smol = "2"
uuid = { version = "1", features = ["v4"] }
tray-icon = "0.25"
sys-locale = "0.3"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
