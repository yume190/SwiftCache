<text x="256" y="376" font-size="12" fill="#172C38" font-weight="400" class="mono">來源   192.168.1.24:54102</text>
<text x="654" y="376" font-size="12" fill="#172C38" font-weight="400" class="mono">完成時間   14:32:18.399 +08:00</text>
<text x="1072" y="376" font-size="12" fill="#172C38" font-weight="400" class="mono">耗時   1.2 ms</text>
<text x="1332" y="376" font-size="12" fill="#087F75" font-weight="600" class="mono">gRPC   OK</text>
<rect x="1474" y="279" width="148" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="1488" y="302" font-size="13" fill="#172C38" font-weight="600">匯出此筆詳細資料</text>
<rect x="236" y="419" width="684" height="271" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="256" y="450" font-size="17" fill="#172C38" font-weight="650">請求</text>
<rect x="800" y="432" width="100" height="25" rx="6" fill="#F0F3F5" stroke="none"/>
<text x="809" y="449" font-size="12" fill="#172C38" font-weight="600">GetValue</text>
<text x="256" y="481" font-size="12" fill="#71818D" font-weight="400">完整 KV key · bytes，以 hex 顯示</text>
<rect x="256" y="497" width="644" height="101" rx="7" fill="#F5F8F9" stroke="none"/>
<text x="270" y="524" font-size="13" fill="#172C38" font-weight="400" class="mono">deadbeef0102a12f7c4821e2f3d49b0052a017aa</text>
<text x="270" y="550" font-size="13" fill="#172C38" font-weight="400" class="mono">8fd7c8d2e4b39c70ef5c804246d5286f</text>
<text x="270" y="576" font-size="13" fill="#172C38" font-weight="400" class="mono">（示意 key）</text>
<text x="256" y="629" font-size="12" fill="#71818D" font-weight="400">Key 為不透明資料，不推測對應的原始碼或編譯參數。</text>
<rect x="256" y="644" width="121" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="270" y="667" font-size="13" fill="#172C38" font-weight="600">複製完整 key</text>
<rect x="940" y="419" width="704" height="271" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="960" y="450" font-size="17" fill="#172C38" font-weight="650">回應</text>
<rect x="1516" y="432" width="106" height="25" rx="6" fill="#E7F4F0" stroke="none"/>
<text x="1525" y="449" font-size="12" fill="#087F75" font-weight="600">SUCCESS</text>
<text x="960" y="484" font-size="12" fill="#71818D" font-weight="400">Outcome</text>
<text x="1110" y="484" font-size="13" fill="#087F75" font-weight="600" class="mono">SUCCESS</text>
<text x="960" y="519" font-size="12" fill="#71818D" font-weight="400">Entries</text>
<text x="1110" y="519" font-size="13" fill="#172C38" font-weight="400">1 筆</text>
<text x="960" y="554" font-size="12" fill="#71818D" font-weight="400">Entries value 合計</text>
<text x="1110" y="554" font-size="13" fill="#172C38" font-weight="400" class="mono">248 bytes</text>
<text x="960" y="607" font-size="12" fill="#71818D" font-weight="400">未命中時顯示 KEY_NOT_FOUND，沒有 entries。</text>
<text x="960" y="635" font-size="12" fill="#71818D" font-weight="400">錯誤時保留 gRPC 狀態與完整錯誤訊息。</text>
<rect x="236" y="710" width="1408" height="320" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="256" y="743" font-size="17" fill="#172C38" font-weight="650">回應 Entries</text>
<text x="420" y="742" font-size="12" fill="#71818D" font-weight="400">逐項保留名稱與原始 bytes</text>
<path d="M256 763H1624" fill="none" stroke="#E1E8EB"/>
<rect x="256" y="780" width="400" height="37" rx="6" fill="#F5F8F9" stroke="none"/>
<text x="270" y="804" font-size="10" fill="#71818D" font-weight="600">ENTRY 名稱</text>
<text x="552" y="804" font-size="10" fill="#71818D" font-weight="600">VALUE 大小</text>
<rect x="256" y="823" width="400" height="47" rx="6" fill="#EAF4F2" stroke="none"/>
<text x="270" y="852" font-size="13" fill="#087F75" font-weight="600" class="mono">value</text>
<text x="552" y="852" font-size="12" fill="#172C38" font-weight="400" class="mono">248 B</text>
<text x="256" y="902" font-size="12" fill="#71818D" font-weight="400">可選取任一 entry 查看其完整內容。</text>
<text x="256" y="930" font-size="12" fill="#71818D" font-weight="400">保存的是原始 bytes；預覽依 Hex / Text 切換。</text>
<text x="256" y="958" font-size="12" fill="#71818D" font-weight="400">資料不作檔案類型或樹狀結構的自動推測。</text>
<text x="688" y="799" font-size="14" fill="#172C38" font-weight="600" class="mono">value</text>
<text x="1150" y="799" font-size="12" fill="#087F75" font-weight="600">Hex  /  Text</text>
<rect x="1475" y="777" width="148" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="1489" y="800" font-size="13" fill="#172C38" font-weight="600">匯出此 entry</text>
<rect x="688" y="816" width="936" height="143" rx="8" fill="#162F3B" stroke="none"/>
<text x="704" y="844" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">000000  0a 19 0a 17 72 6f 6f 74 20 70 61 79 6c 6f 61 64  | ....root payload</text>
<text x="704" y="869" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">000010  12 19 0a 17 6c 65 61 66 20 70 61 79 6c 6f 61 64  | ....leaf payload</text>
<text x="704" y="894" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">000020  1a 20 98 ab 76 cd 54 ef 20 e1 9a 61 8f d7 c8 d2  | . ..v.T. ..a....</text>
<text x="704" y="940" font-size="11" fill="#93B5C2" font-weight="400">示意預覽 · 可捲動查看全部 248 bytes</text>
<text x="688" y="994" font-size="12" fill="#087F75" font-weight="600">關聯事件  2 筆</text>
<text x="1130" y="994" font-size="12" fill="#71818D" font-weight="400">完整請求 / 回應可切換為原始資料檢視。</text>
