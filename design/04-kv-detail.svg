<text x="24" y="1102" font-size="11" fill="#71818D" font-weight="600">DESIGN PROPOSAL   /   02</text>
<text x="365" y="1102" font-size="12" fill="#71818D" font-weight="400">所有用量與記錄均為示意；UI 管理、用量掃描、詳細記錄與清除流程尚待實作。</text>
<text x="1456" y="1102" font-size="12" fill="#087F75" font-weight="600">架構尚未選定</text>
<text x="236" y="83" font-size="28" fill="#172C38" font-weight="650">傳輸明細 / KV GetValue</text>
<text x="236" y="111" font-size="14" fill="#71818D" font-weight="400">逐筆追蹤請求與回應，從列表查看每一次資料交換。</text>
<rect x="236" y="140" width="1408" height="64" rx="10" fill="#fff" stroke="#E1E8EB"/>
<circle cx="259" cy="172" r="4" fill="#087F75"/>
<text x="273" y="170" font-size="14" fill="#172C38" font-weight="600">服務執行中</text>
<text x="273" y="189" font-size="11" fill="#71818D" font-weight="400">已執行 00:12:34</text>
<text x="470" y="167" font-size="10" fill="#71818D" font-weight="600">LISTENER</text>
<text x="470" y="188" font-size="13" fill="#172C38" font-weight="400" class="mono">0.0.0.0:50051</text>
<text x="710" y="167" font-size="10" fill="#71818D" font-weight="600">STORE</text>
<text x="710" y="188" font-size="13" fill="#172C38" font-weight="400" class="mono">./cache/store</text>
<rect x="1008" y="159" width="140" height="25" rx="6" fill="#E7F4F0" stroke="none"/>
<text x="1017" y="176" font-size="12" fill="#087F75" font-weight="600">●  詳細記錄開啟</text>
<rect x="1370" y="154" width="112" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="1384" y="177" font-size="13" fill="#172C38" font-weight="600">編輯設定</text>
<rect x="1494" y="154" width="130" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="1508" y="177" font-size="13" fill="#172C38" font-weight="600">■  停止服務</text>
<text x="236" y="243" font-size="13" fill="#087F75" font-weight="600">← 返回傳輸列表</text>
<rect x="236" y="264" width="1408" height="135" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="256" y="297" font-size="23" fill="#172C38" font-weight="650">#003695</text>
<rect x="398" y="275" width="105" height="25" rx="6" fill="#EDF2FC" stroke="none"/>
<text x="407" y="292" font-size="12" fill="#356BC4" font-weight="600">↓  KV 查詢</text>
<rect x="512" y="275" width="64" height="25" rx="6" fill="#E7F4F0" stroke="none"/>
<text x="521" y="292" font-size="12" fill="#087F75" font-weight="600">命中</text>
