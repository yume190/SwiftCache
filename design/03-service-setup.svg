<g clip-path="url(#c12)">
<text x="1282" y="558" font-size="12.5" fill="#172C38" font-weight="400" class="mono">SWIFTCACHE_LOG=swiftcache=info swiftcache serve \</text>
<text x="1297" y="577.4" font-size="12.5" fill="#172C38" font-weight="400" class="mono">--store /Users/yume/git/yume/SwiftCache/cache/store \</text>
<text x="1297" y="596.8" font-size="12.5" fill="#172C38" font-weight="400" class="mono">--tcp 0.0.0.0:50051 \</text>
<text x="1297" y="616.1" font-size="12.5" fill="#172C38" font-weight="400" class="mono">--socket /tmp/swiftcache/cache.sock \</text>
<text x="1297" y="635.5" font-size="12.5" fill="#172C38" font-weight="400" class="mono">--max-message-size 536870912</text>
</g>
<text x="1269" y="680.9" font-size="12" fill="#71818D" font-weight="400">反映上方表單內容；未啟用的 socket / blob 選項不產生 CLI 參數。</text>
<text x="1269" y="697.9" font-size="12" fill="#71818D" font-weight="400">UI 詳細紀錄另由 UI 管理。</text>
