<text x="285" y="744" font-size="12" fill="#71818D" font-weight="400">訊息上限、Log、檔案回應與本機清除路徑</text>
<text x="269" y="775" font-size="12" fill="#71818D" font-weight="400">不支援熱更新；套用設定時明確重啟。</text>
