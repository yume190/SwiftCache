<text x="1377" y="230" font-size="13" fill="#172C38" font-weight="400">訊息、層級、時間、來源</text>
<text x="1269" y="257" font-size="13" fill="#71818D" font-weight="400">每筆傳輸</text>
<text x="1377" y="257" font-size="13" fill="#172C38" font-weight="400">完整請求 / 回應、結果與耗時</text>
<text x="1269" y="283" font-size="13" fill="#71818D" font-weight="400">Payload</text>
<text x="1377" y="284" font-size="13" fill="#172C38" font-weight="400">保存原始 bytes，供預覽與匯出</text>
