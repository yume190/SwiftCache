<text x="269" y="298" font-size="16" fill="#172C38" font-weight="650">Server 連線與儲存</text>
<text x="269" y="316" font-size="12" fill="#71818D" font-weight="400">本機工具鏈透過 socket 使用快取；其他機器的 Proxy 透過 TCP 連入。</text>
<text x="269" y="347" font-size="12" fill="#71818D" font-weight="600">連線名稱（選填）</text>
<rect x="269.5" y="357.5" width="939" height="35" rx="6.5" fill="#F4F7F8" stroke="#E1E8EB"/>
