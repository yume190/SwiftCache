<text x="269" y="412" font-size="12" fill="#71818D" font-weight="400">留空會依連線位址自動顯示預設名稱。名稱可以重複。</text>
<text x="269" y="443" font-size="12" fill="#71818D" font-weight="600">快取目錄 · --store / SWIFTCACHE_STORE</text>
<rect x="269.5" y="453.5" width="939" height="35" rx="6.5" fill="#F4F7F8" stroke="#E1E8EB"/>
