<text x="1269" y="412" font-size="12" fill="#71818D" font-weight="400">紀錄與快取目錄分開；清空快取時保留。文字 log 層級與 UI 詳細紀</text>
<text x="1269" y="429" font-size="12" fill="#71818D" font-weight="400">錄分別設定。</text>
