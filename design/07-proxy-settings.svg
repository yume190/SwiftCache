<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">SwiftCache UI 設計稿 — 服務設定 / Proxy</title>
<desc id="desc">繁體中文桌面介面設計提案。所有記錄與數據均為示意資料，尚未實作。</desc>
<defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans CJK TC',sans-serif}.mono{font-family:'SF Mono',Menlo,monospace}text{text-rendering:optimizeLegibility}</style>
</defs>
<rect x="0" y="0" width="1680" height="1120" rx="0" fill="#F4F7F8" stroke="none"/>
<rect x="0" y="0" width="1680" height="36" rx="0" fill="#EAF0F2" stroke="none"/>
<circle cx="22" cy="18" r="5" fill="#D5A1A0"/>
<circle cx="41" cy="18" r="5" fill="#DCC78B"/>
<circle cx="60" cy="18" r="5" fill="#9BBEAC"/>
<text x="750" y="23" font-size="12" fill="#71818D" font-weight="600">SwiftCache</text>
<text x="1445" y="23" font-size="11" fill="#71818D" font-weight="600">UI CONCEPT / 示意資料</text>
<rect x="0" y="36" width="200" height="1040" rx="0" fill="#fff" stroke="none"/>
<rect x="22" y="65" width="34" height="34" rx="10" fill="#087F75" stroke="none"/>
<text x="30" y="88" font-size="23" fill="#fff" font-weight="700">S</text>
<text x="67" y="88" font-size="18" fill="#172C38" font-weight="700">SwiftCache</text>
<text x="24" y="131" font-size="10" fill="#71818D" font-weight="700">WORKSPACE</text>
<rect x="16" y="148" width="168" height="61" rx="8" fill="#F5F8F9" stroke="#E1E8EB"/>
<circle cx="32" cy="169" r="4" fill="#94A1AA"/>
<text x="44" y="173" font-size="13" fill="#172C38" font-weight="600">團隊遠端 Proxy</text>
<text x="32" y="193" font-size="11" fill="#71818D" font-weight="400">Proxy · 尚未啟動</text>
<rect x="12" y="235" width="176" height="39" rx="7" fill="#E8F3F0" stroke="none"/>
<text x="26" y="260" font-size="19" fill="#087F75" font-weight="400">▤</text>
<text x="55" y="259" font-size="14" fill="#087F75" font-weight="600">服務設定</text>
<rect x="12" y="282" width="176" height="39" rx="7" fill="#fff" stroke="none"/>
<text x="26" y="307" font-size="19" fill="#71818D" font-weight="400">↕</text>
<text x="55" y="306" font-size="14" fill="#71818D" font-weight="400">傳輸明細</text>
<rect x="12" y="329" width="176" height="39" rx="7" fill="#fff" stroke="none"/>
<text x="26" y="354" font-size="19" fill="#71818D" font-weight="400">≡</text>
<text x="55" y="353" font-size="14" fill="#71818D" font-weight="400">事件紀錄</text>
<rect x="12" y="376" width="176" height="39" rx="7" fill="#fff" stroke="none"/>
<text x="26" y="401" font-size="19" fill="#71818D" font-weight="400">▦</text>
<text x="55" y="400" font-size="14" fill="#71818D" font-weight="400">快取管理</text>
<path d="M22 444H178" fill="none" stroke="#E1E8EB"/>
<text x="24" y="477" font-size="11" fill="#71818D" font-weight="600">已儲存的連線</text>
<circle cx="29" cy="509" r="4" fill="#9BA9B1"/>
<text x="43" y="514" font-size="12" fill="#71818D" font-weight="400">團隊遠端 Proxy</text>
<rect x="16" y="779" width="168" height="153" rx="9" fill="#F3F8F7" stroke="#DFEAE6"/>
<text x="29" y="804" font-size="11" fill="#71818D" font-weight="600">上游快取用量</text>
<text x="29" y="835" font-size="19" fill="#172C38" font-weight="650">無法取得</text>
<text x="29" y="860" font-size="10" fill="#71818D" font-weight="400">目前協定無管理 API</text>
<text x="29" y="888" font-size="11" fill="#71818D" font-weight="400">本機紀錄  186 MiB</text>
<text x="24" y="967" font-size="11" fill="#71818D" font-weight="400">CLI 與 UI 共用操作概念</text>
<text x="24" y="990" font-size="12" fill="#172C38" font-weight="500" class="mono">serve / proxy</text>
<path d="M0 1076H1680" fill="none" stroke="#E1E8EB"/>
<text x="24" y="1102" font-size="11" fill="#71818D" font-weight="600">DESIGN PROPOSAL   /   02</text>
<text x="365" y="1102" font-size="12" fill="#71818D" font-weight="400">所有用量與記錄均為示意；UI 管理、用量掃描、詳細記錄與清除流程尚待實作。</text>
<text x="1456" y="1102" font-size="12" fill="#087F75" font-weight="600">架構尚未選定</text>
<text x="236" y="83" font-size="28" fill="#172C38" font-weight="650">服務設定 / Proxy</text>
<text x="236" y="111" font-size="14" fill="#71818D" font-weight="400">直接在畫面設定並啟動服務，也能複製同等的 CLI 指令。</text>
<rect x="236" y="140" width="1408" height="64" rx="10" fill="#fff" stroke="#E1E8EB"/>
<circle cx="259" cy="172" r="4" fill="#94A1AA"/>
<text x="273" y="170" font-size="14" fill="#172C38" font-weight="600">Proxy 已停止</text>
<text x="273" y="189" font-size="11" fill="#71818D" font-weight="400">上游設定已儲存</text>
<text x="490" y="167" font-size="10" fill="#71818D" font-weight="600">UPSTREAM</text>
<text x="490" y="188" font-size="13" fill="#172C38" font-weight="400" class="mono">http://cache-host:50051</text>
<text x="870" y="167" font-size="10" fill="#71818D" font-weight="600">LOCAL SOCKET</text>
<text x="870" y="188" font-size="13" fill="#172C38" font-weight="400" class="mono">/tmp/swiftcache/cache.sock</text>
<rect x="1480" y="154" width="144" height="36" rx="7" fill="#087F75" stroke="none"/>
<text x="1494" y="177" font-size="13" fill="#fff" font-weight="600">▶  啟動 Proxy</text>
<rect x="236" y="226" width="1408" height="63" rx="10" fill="#fff" stroke="#E1E8EB"/>
<rect x="420" y="239" width="164" height="36" rx="7" fill="#E8F3F0" stroke="none"/>
<text x="272" y="262" font-size="14" fill="#71818D" font-weight="600">Serve · 快取服務</text>
<text x="440" y="262" font-size="14" fill="#087F75" font-weight="600">Proxy · 本機中繼</text>
<text x="1186" y="262" font-size="12" fill="#71818D" font-weight="400">執行中修改設定需重新啟動服務</text>
<rect x="236" y="310" width="888" height="650" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="256" y="343" font-size="17" fill="#172C38" font-weight="650">Proxy 連線設定</text>
<text x="256" y="373" font-size="12" fill="#71818D" font-weight="400">先查本機 CAS / KV 快取；未命中時向上游取得並保存。</text>
<text x="256" y="414" font-size="12" fill="#71818D" font-weight="500">快取目錄 · --store / SWIFTCACHE_STORE</text>
<rect x="256" y="426" width="848" height="40" rx="7" fill="#FAFCFC" stroke="#E1E8EB"/>
<text x="269" y="452" font-size="13" fill="#172C38" font-weight="400" class="mono">/var/tmp/swiftcache-proxy</text>
<text x="256" y="503" font-size="12" fill="#71818D" font-weight="500">本機 Unix socket · --socket</text>
<rect x="256" y="515" width="848" height="40" rx="7" fill="#FAFCFC" stroke="#E1E8EB"/>
<text x="269" y="541" font-size="13" fill="#172C38" font-weight="400" class="mono">/tmp/swiftcache/cache.sock</text>
<text x="256" y="592" font-size="12" fill="#71818D" font-weight="500">單筆訊息上限 · --max-message-size</text>
<rect x="256" y="604" width="400" height="40" rx="7" fill="#FAFCFC" stroke="#E1E8EB"/>
<text x="269" y="630" font-size="13" fill="#172C38" font-weight="400" class="mono">512 MiB</text>
<text x="680" y="592" font-size="12" fill="#71818D" font-weight="500">文字 Log 層級 · SWIFTCACHE_LOG</text>
<rect x="680" y="604" width="424" height="40" rx="7" fill="#FAFCFC" stroke="#E1E8EB"/>
<text x="693" y="630" font-size="13" fill="#172C38" font-weight="400" class="mono">swiftcache=info  ▾</text>
<rect x="256" y="673" width="16" height="16" rx="4" fill="#fff" stroke="#B5C3CB"/>
<text x="283" y="686" font-size="13" fill="#172C38" font-weight="500">啟用本機檔案回應目錄 · --blob-dir</text>
<rect x="256" y="702" width="848" height="39" rx="7" fill="#F4F7F8" stroke="#E1E8EB"/>
<text x="270" y="727" font-size="13" fill="#71818D" font-weight="400">未設定；本機 client 接收 inline bytes</text>
<text x="256" y="776" font-size="12" fill="#71818D" font-weight="400">此目錄位於開發機，用於提供本機 client 可存取的檔案回應。</text>
<text x="256" y="809" font-size="12" fill="#71818D" font-weight="400">上傳時，本機 file_path 會被讀成 bytes 再傳到遠端。</text>
<path d="M256 841H1104" fill="none" stroke="#E1E8EB"/>
<text x="256" y="869" font-size="12" fill="#71818D" font-weight="500">上游快取位址 · --upstream / SWIFTCACHE_UPSTREAM</text>
<rect x="256" y="880" width="848" height="40" rx="7" fill="#FAFCFC" stroke="#E1E8EB"/>
<text x="269" y="906" font-size="13" fill="#172C38" font-weight="400" class="mono">http://cache-host:50051</text>
<text x="256" y="944" font-size="12" fill="#71818D" font-weight="400">清除快取只作用於本機 store；上游資料保留。</text>
<rect x="236" y="982" width="143" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="250" y="1005" font-size="13" fill="#172C38" font-weight="600">儲存設定</text>
<rect x="392" y="982" width="143" height="36" rx="7" fill="#087F75" stroke="none"/>
<text x="406" y="1005" font-size="13" fill="#fff" font-weight="600">▶  啟動 Proxy</text>
<rect x="1144" y="310" width="500" height="268" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="1166" y="343" font-size="17" fill="#172C38" font-weight="650">遠端容量與清除</text>
<rect x="1166" y="365" width="166" height="25" rx="6" fill="#F0F3F5" stroke="none"/>
<text x="1175" y="382" font-size="12" fill="#71818D" font-weight="600">尚無遠端管理能力</text>
<text x="1166" y="420" font-size="12" fill="#71818D" font-weight="400">上游磁碟用量</text>
<text x="1410" y="420" font-size="13" fill="#172C38" font-weight="600">無法取得</text>
<text x="1166" y="458" font-size="12" fill="#71818D" font-weight="400">遠端清除操作</text>
<text x="1410" y="458" font-size="13" fill="#172C38" font-weight="600">目前不提供</text>
<text x="1166" y="503" font-size="12" fill="#71818D" font-weight="400">現有 gRPC 僅提供 CAS / KV，不含管理 API。</text>
<text x="1166" y="534" font-size="12" fill="#71818D" font-weight="400">遠端管理需在後續架構討論中決定連線方式。</text>
<rect x="1144" y="598" width="500" height="175" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="1166" y="631" font-size="17" fill="#172C38" font-weight="650">本機紀錄</text>
<text x="1166" y="666" font-size="12" fill="#71818D" font-weight="400">事件與傳輸詳細資料保存在此開發機。</text>
<text x="1166" y="700" font-size="12" fill="#71818D" font-weight="400">本機紀錄用量</text>
<text x="1410" y="700" font-size="15" fill="#7755B6" font-weight="650" class="mono">186 MiB</text>
<text x="1166" y="747" font-size="12" fill="#71818D" font-weight="400">不把本機紀錄容量當作遠端快取用量。</text>
<rect x="1144" y="793" width="500" height="237" rx="10" fill="#fff" stroke="#E1E8EB"/>
<text x="1166" y="826" font-size="17" fill="#172C38" font-weight="650">同等 CLI 指令</text>
<rect x="1166" y="846" width="456" height="113" rx="8" fill="#162F3B" stroke="none"/>
<text x="1180" y="868" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">./server/target/release/swiftcache proxy \</text>
<text x="1180" y="891" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">  --store /var/tmp/swiftcache-proxy \</text>
<text x="1180" y="914" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">  --socket /tmp/swiftcache/cache.sock \</text>
<text x="1180" y="937" font-size="12" fill="#D1E1E7" font-weight="400" class="mono">  --upstream http://cache-host:50051</text>
<rect x="1475" y="978" width="147" height="36" rx="7" fill="#fff" stroke="#E1E8EB"/>
<text x="1489" y="1001" font-size="13" fill="#172C38" font-weight="600">複製 CLI 指令</text>
</svg>
